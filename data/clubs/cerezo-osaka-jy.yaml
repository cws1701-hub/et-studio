    summary: >
      2017년 대한체육회·대한축구협회 주최 i-리그 우수선수 트레이닝을 통해 선발된
      한국 유소년 선수 16명과 지도자 2명이 세레소 오사카로 연수를 다녀온 사례가
      언론 보도로 확인됨. 다만 이는 '단기 연수'이며 '주니어유스 정식 입단/유학'과는
      다른 사안이므로, 정식 유학(입단) 가능 여부는 별도로 구단에 직접 문의해야 함.
    source: "경향신문, 2017.11.23, https://www.khan.co.kr/article/201711232056015"
