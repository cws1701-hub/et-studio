    단, 창단연도·기숙사 유무·코칭스태프·학비·유학생 수용 정책·졸업생 명단은
    여전히 미확인. 웹사이트가 두 도메인으로 나뉘어 있고 U-15 팀도 3개(본/西/와카야마)
    라는 점을 발견했으므로, 콘텐츠 제작 전 반드시 cerezo.jp/academy/u15/ 페이지를
