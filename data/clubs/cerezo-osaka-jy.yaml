note: >
  [중요] 세레소 오사카 아카데미는 U-15 카테고리를 3개 팀(본 U-15, 西(니시) U-15,
  와카야마 U-15)으로 운영하며, 웹사이트도 두 도메인(cerezo.jp — J리그 구단 공식,
  cerezo-sportsclub.com — 별도 법인 "세레소 오사카 스포츠클럽")으로 나뉘어 있음을
  확인함. 이 파일은 그중 "본 U-15(セレッソ大阪U-15)"를 기준으로 작성. 콘텐츠 제작 시
  西/와카야마 U-15와 혼동하지 않도록 주의. (출처: 구단 홈페이지 검색 결과, 2026-08-13)

